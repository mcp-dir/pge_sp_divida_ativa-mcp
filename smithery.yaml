# Smithery configuration for Procuradoria Geral do Estado SP: Dívida Ativa
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_pge_sp_divida_ativa

name: pge_sp_divida_ativa-mcp
displayName: "Procuradoria Geral do Estado SP: Dívida Ativa"
description: >
  Procuradoria Geral do Estado SP: Dívida Ativa, consulta em fonte oficial. Hospedado pela plataforma, sem credenciais da plataforma, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/pge_sp_divida_ativa-mcp
repository: https://github.com/mcp-dir/pge_sp_divida_ativa-mcp

tags:
  - pge_sp_divida_ativa
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_pge_sp_divida_ativa

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_pge_sp_divida_ativa/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
